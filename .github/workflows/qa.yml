name: QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: nlemoine/.github/.github/workflows/php-qa.yml@e407d94a038fc2da134514860c5876f3a0c9d6f7
    with:
      cs-tool: phpcs
      composer-normalize: true
      extra-stan-args: --memory-limit=-1
      # The Mantle packages require each other with ^1.0, so their lowest
      # versions do not work together.
      test-lowest: false
      extra-test-legs: >-
        [{"name": "WP trunk", "php": "8.4", "env": {"WP_VERSION": "trunk"}, "experimental": true}]
      run-infection: true
      infection-diff: true
      infection-gate: true
      # Mantle installs WordPress on the first run and reports it on STDERR,
      # which Infection reads as a failing initial test run.
      infection-setup-command: composer test
      extra-infection-args: --with-uncovered
    secrets: inherit
